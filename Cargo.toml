[package]
name = "rustnarok-client"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
# Plain `cargo run` starts the client, not the dev MCP server in src/bin.
default-run = "rustnarok-client"

[dependencies]
arboard = { version = "3.4", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.17"
encoding_rs = "0.8"
flate2 = "1"
fontdue = "0.9.4"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tga"] }
lunify = "1"
mlua = { version = "0.12", features = ["lua51", "vendored"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "pcm", "wav"] }
wgpu = "29"
winit = "0.30"

# The Dock icon when the client runs outside the app bundle; the versions winit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSData"] }

# Rebuilds after an edit reuse what didn't change: several times less work for a small change. tools/bundle.sh turns it
# off for the app it builds (full optimization across modules).
[profile.release]
incremental = true
