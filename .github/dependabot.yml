version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # objc2 must be the one winit uses (0.5 with objc2-app-kit 0.2), or macOS doesn't build; CI builds only on Linux.
      - dependency-name: "objc2*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
